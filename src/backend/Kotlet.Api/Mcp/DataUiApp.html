const isOperationResult=data=>!Array.isArray(data)&&data&&typeof data==="object"&&"status" in data&&(operationPayload(data)!==null||data.validationErrors);
const initials=name=>String(name||"?").trim().split(/\s+/).slice(0,2).map(part=>part[0]||"").join("").toUpperCase();
function technical(object){const entries=Object.entries(object||{}).filter(([key,value])=>technicalKeys.has(key)&&value!==null&&value!==undefined);return entries.length?`<details class="technical"><summary>${esc(t("technical"))}</summary><dl>${entries.map(([key,value])=>`<dt>${esc(label(key))}</dt><dd>${esc(value)}</dd>`).join("")}</dl></details>`:""}
function validation(errors){if(!errors)return"";return `<div class="validation-list">${Object.entries(errors).flatMap(([field,messages])=>(messages||[]).map(message=>`<div class="validation-item"><strong>${esc(label(field))}</strong><div class="meta">${esc(message)}</div></div>`)).join("")}</div>`}
function mealOperation(data,item){const success=String(data.status).toLowerCase()==="success",participants=item.participants||[],guests=Number(item.guests||0),servings=Number(item.servings||0),slot=item.slot?tv("slot",item.slot):t("mealSlotFallback"),kind=item.type?tv("type",item.type):t("mealSlotFallback");setHeading(t(success?"mealSaved":"mealUpdate"),slot);root.innerHTML=`<section class="operation-hero ${success?"":"error"}"><span class="status-icon">${success?"✓":"!"}</span><div><h2>${esc(t(success?"mealAdded":"mealFailed"))}</h2><p>${esc(success?t("mealReady",{slot}):t("mealStatus",{status:tv("status",data.status)}))}</p></div></section><article class="card meal-result"><div class="meal-top"><div class="meal-kicker"><span class="tag">${esc(slot)}</span><span class="tag">${esc(kind)}</span>${item.servingsOverridden?`<span class="tag warn">${esc(t("mealCustomServings"))}</span>`:""}</div><h2 class="meal-title">${esc(item.displayName||t("mealPlanned"))}</h2>${item.note?`<p class="meal-note">${esc(item.note)}</p>`:""}</div><div class="meal-stats"><div class="meal-stat"><strong>${servings.toLocaleString(lang,{maximumFractionDigits:2})}</strong><span>${esc(t("mealServings"))}</span></div><div class="meal-stat"><strong>${participants.length}</strong><span>${esc(t("mealMembers"))}</span></div><div class="meal-stat"><strong>${guests}</strong><span>${esc(t("mealGuests"))}</span></div></div><div class="people"><div class="people-title"><h3>${esc(t("mealEating"))}</h3><span>${esc(t("mealTotal",{count:participants.length+guests}))}</span></div>${participants.length?participants.map(person=>`<div class="person"><span class="avatar">${esc(initials(person.displayName))}</span><div class="person-main"><strong>${esc(person.displayName||t("mealMember"))}</strong>${person.isCurrentUser?`<span class="tag ok">${esc(t("mealYou"))}</span>`:""}</div><div class="portion"><strong>${esc(person.portionPercent||100)}%</strong><span>${esc(t("mealPortion"))}</span></div></div>`).join(""):`<div class="empty-state">${esc(t("mealNoMembers"))}</div>`}${technical(item)}</div></article>${validation(data.validationErrors)}`}
function operation(data){const payload=operationPayload(data),status=String(data.status||""),success=status.toLowerCase()==="success",statusLabel=status?tv("status",status):t("operationPayload");if(data.item&&data.item.displayName){mealOperation(data,data.item);return}setHeading(t(success?"operationSaved":"operationResult"),statusLabel);root.innerHTML=`<section class="operation-hero ${success?"":"error"}"><span class="status-icon">${success?"✓":"!"}</span><div><h2>${esc(t(success?"operationChangesSaved":"operationAttention"))}</h2><p>${esc(statusLabel)}</p></div></section>${payload?`<article class="card"><h2>${esc(payload.title||payload.name||payload.displayName||t("operationPayload"))}</h2><dl>${fields(Object.fromEntries(Object.entries(payload).filter(([key])=>!technicalKeys.has(key))))}</dl>${technical(payload)}</article>`:""}${validation(data.validationErrors)}`}
let lastResult=null;
function renderToolResult(params){lastResult=params;locale.server=params&&params._meta&&params._meta["kotlet/locale"]||null;applyLanguage();const data=params&&params._meta&&params._meta["kotlet/uiData"]||params&&params.structuredContent;if(isOperationResult(data))operation(data);else render(data,params&&params.content)}
function render(data,content){root.innerHTML="";if(data!==undefined&&data!==null){if(Array.isArray(data)&&data.length&&data.every(item=>item&&"inputName" in item&&"exactMatch" in item))ingredientMatches(data);else if(Array.isArray(data)&&data.length&&data.every(item=>item&&"isPurchased" in item&&"totalPrice" in item))shopping(data);else if(Array.isArray(data)&&data.length&&data.every(item=>item&&"expirationDate" in item&&"storageLocation" in item))pantry(data);else if(Array.isArray(data)&&data.length&&data.every(item=>item&&"date" in item&&"meals" in item))mealPlan(data);else if((Array.isArray(data)&&data.length&&data.every(item=>item&&"caloriesPerServing" in item&&"addons" in item))||(!Array.isArray(data)&&typeof data==="object"&&"caloriesPerServing" in data&&"addons" in data))prepared(data);else if(!Array.isArray(data)&&typeof data==="object"&&"exists" in data&&Array.isArray(data.matches))duplicates(data);else if(!Array.isArray(data)&&typeof data==="object"&&"pantryVersion" in data&&Array.isArray(data.added)&&Array.isArray(data.needsReview))pantryReconciliation(data);else if(Array.isArray(data)){setHeading(t("toolResult"),tp("items",data.length));root.innerHTML=data.length?(data.every(v=>v&&typeof v==="object"&&!Array.isArray(v))?table(data):complex(data)):`<p class="message">${esc(t("noItems"))}</p>`}else if(typeof data==="object"){setHeading(t("toolResult"),t("details"));root.innerHTML=objectView(data)}else{setHeading(t("toolResult"),"");root.innerHTML=`<p class="message">${scalar(data)}</p>`}return}const blocks=content||[];const links=blocks.filter(b=>b.type==="resource_link");if(links.length){resourceLinks(links);return}const text=blocks.filter(b=>b.type==="text").map(b=>b.text).join("\n");setHeading(t("toolResult"),"");root.innerHTML=text?`<article class="card"><pre>${esc(text)}</pre></article>`:`<p class="message">${esc(t("noData"))}</p>`}
function context(value){const theme=value&&value.theme;document.documentElement.classList.toggle("app-dark",theme?theme==="dark":matchMedia("(prefers-color-scheme: dark)").matches);locale.host=(value&&(value.locale||value.language))||locale.host;if(applyLanguage()&&lastResult)renderToolResult(lastResult)}
bridge.on("ui/notifications/tool-result",renderToolResult);bridge.on("ui/notifications/host-context-changed",params=>context((params&&params.hostContext)||params));
applyLanguage();root.innerHTML=`<p class="message">${esc(t("loading"))}</p>`;
(async()=>{context(null);try{const result=await bridge.request("ui/initialize",{protocolVersion:"2026-01-26",appInfo:{name:"kotlet-data",version:"1.0.0"},appCapabilities:{availableDisplayModes:["inline"]}});context(result&&result.hostContext);bridge.notify("ui/notifications/initialized")}catch(error){root.innerHTML=`<p class="message">${esc(t("initFailed",{message:error.message}))}</p>`}})();
</script>
</body>
