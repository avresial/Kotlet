<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Kotlet recipes</title>
<style>
  /* Palette and card styling mirror src/frontend (styles.scss, recipe-list-page.scss,
     recipe-detail-page.scss) so the embedded UI looks like the Kotlet app. */
  :root {
    --app-bg: #f6f1e8; --app-surface: #fffaf2; --app-surface-raised: #fffdf9; --app-surface-bright: #fff;
    --app-text: #29251f; --app-text-soft: #554e45; --app-text-muted: #746d63;
    --app-border: #dcd2c4; --app-border-strong: #cfc3b4;
    --app-inset: #f4ead9; --app-inset-strong: #f2dfd7;
    --app-accent: #8e392b; --app-accent-bg: #f8e8e2;
    --app-danger: #9a3022; --app-danger-bg: #fff0ec; --app-danger-border: #d99b8b;
    --app-ai: #5b3ca0; --app-ai-bg: #eee7ff;
    --app-link: #7d3428;
    color: var(--app-text); background: var(--app-bg); font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
  }
  .app-dark {
    --app-bg: #171512; --app-surface: #211e1a; --app-surface-raised: #29251f; --app-surface-bright: #302b25;
    --app-text: #f4eee5; --app-text-soft: #ded5c9; --app-text-muted: #b8aea1;
    --app-border: #49423a; --app-border-strong: #5a5147;
    --app-inset: #2c2823; --app-inset-strong: #38312a;
    --app-accent: #d98a6f; --app-accent-bg: #3a2620;
    --app-danger: #e2917f; --app-danger-bg: #33211d; --app-danger-border: #6d3d33;
    --app-ai: #c6b3f0; --app-ai-bg: #2c2440;
    --app-link: #d98a6f;
  }
  html, body { margin: 0; min-width: 16rem; }
  body { color: var(--app-text); background: var(--app-bg); padding: 1rem; box-sizing: border-box; }
  button { font: inherit; }

  .eyebrow { margin: 0; color: var(--app-accent); font-size: .7rem; font-weight: 800; letter-spacing: .13em; text-transform: uppercase; }
  .empty { margin: 2rem 0; color: var(--app-text-muted); text-align: center; }
  .error {
    padding: 12px 16px; margin-bottom: 16px; border-radius: .6rem;
    background: var(--app-danger-bg); color: var(--app-danger); border: 1px solid var(--app-danger-border);
  }
  .ai-badge {
    display: inline-block; padding: .1rem .45rem; border-radius: 999px; vertical-align: middle;
    background: var(--app-ai-bg); color: var(--app-ai); font-size: .65rem; font-weight: 700; letter-spacing: .05em;
  }

  .recipe-media-container {
    position: relative; width: 100%; height: 8.5rem; background: var(--app-inset);
    overflow: hidden; display: flex; align-items: center; justify-content: center;
  }
  .recipe-image { display: block; width: 100%; height: 100%; object-fit: cover; }
  .recipe-placeholder {
    display: flex; align-items: center; justify-content: center; width: 100%; height: 100%;
    background: var(--app-inset); color: var(--app-text-muted); opacity: .8;
  }
  .recipe-placeholder svg { width: 2.75rem; height: 2.75rem; }

  /* List view (mirrors .recipe-grid / .recipe-card) */
  .recipe-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(13rem, 1fr)); gap: 1rem; margin-top: .6rem; }
  .recipe-card {
    position: relative; display: flex; flex-direction: column; overflow: hidden;
    border: 1px solid var(--app-border); border-radius: 1rem; background: var(--app-surface);
    box-shadow: 0 .7rem 2rem rgb(70 52 31 / 5%); transition: transform .15s ease, box-shadow .15s ease;
  }
  .card-body { flex: 1; padding: 14px 16px; }
  .card-body h2 { margin: 0 0 6px; font: 500 1.15rem Georgia, serif; word-break: break-word; }
  .card-body .meta { margin: 0 0 6px; font-size: .85rem; color: var(--app-text-muted); line-height: 1.3; }
  .card-summary { margin: 4px 0 0; font-size: .85rem; color: var(--app-text-soft); line-height: 1.4; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }
  .card-actions { padding: 0 16px 14px; }
  .button {
    display: inline-flex; align-items: center; justify-content: center; padding: 8px 16px; border-radius: 6px;
    border: 1px solid transparent; font-size: .9rem; font-weight: 500; cursor: pointer; text-decoration: none; min-height: 2.5rem;
  }
  .button.primary { background: #963827; color: #fff; width: 100%; box-sizing: border-box; }
  .button.primary:hover { background: #842f20; }
  .button.secondary { background: transparent; border-color: var(--app-border-strong); color: var(--app-text-soft); }
  .button:disabled { opacity: .5; cursor: not-allowed; }
  .list-footer { margin-top: 1rem; font-size: .85rem; color: var(--app-text-muted); text-align: center; }

  /* Detail view (mirrors recipe-detail-page) */
  .back {
    display: inline-flex; align-items: center; margin-bottom: .8rem; padding: .4rem 0; border: 0; background: none;
    color: var(--app-link); font-size: .9rem; font-weight: 700; cursor: pointer; min-height: 2.2rem;
  }
  .detail-card {
    border: 1px solid var(--app-border); border-radius: 1rem; overflow: hidden;
    background: var(--app-surface); box-shadow: 0 .7rem 2rem rgb(70 52 31 / 5%);
  }
  .detail-media-container {
    position: relative; width: 100%; max-height: 16rem; background: var(--app-inset);
    overflow: hidden; display: flex; align-items: center; justify-content: center;
  }
  .detail-media-container.detail-placeholder { height: 7.5rem; }
  .detail-image { display: block; width: 100%; max-height: 16rem; object-fit: cover; }
  .detail-body { padding: 1.1rem 1.25rem 1.4rem; }
  .detail-body h1 { margin: .35rem 0 .6rem; font: 500 1.7rem/1.15 Georgia, serif; word-break: break-word; }
  .detail-meta { margin: 0 0 1rem; font-size: .85rem; color: var(--app-text-muted); line-height: 1.4; }
  .detail-body h2 { margin: 1.2rem 0 .5rem; font: 500 1.15rem Georgia, serif; border-bottom: 1px solid var(--app-inset-strong); padding-bottom: .3rem; }
  .ingredient-list { margin: 0; padding: 0; list-style: none; }
  .ingredient-item {
    display: flex; align-items: baseline; justify-content: space-between; gap: .75rem;
    padding: .5rem .1rem; border-bottom: 1px solid var(--app-border);
  }
  .ingredient-item:last-child { border-bottom: 0; }
  .ing-name { font-weight: 500; }
  .ing-note { display: block; font-size: .8rem; color: var(--app-text-muted); }
  .ing-qty { white-space: nowrap; color: var(--app-text-soft); }
  .markdown-body { line-height: 1.55; color: var(--app-text-soft); }
  .markdown-body p { margin: .5rem 0; }
  .markdown-body ol, .markdown-body ul { margin: .5rem 0; padding-left: 1.4rem; }
  .markdown-body li { margin: .3rem 0; }
  .markdown-body h3, .markdown-body h4 { margin: .9rem 0 .35rem; color: var(--app-text); }
  .incomplete-note { margin: .5rem 0 1rem; padding: .7rem .8rem; border-radius: .5rem; background: var(--app-accent-bg); color: var(--app-text-soft); font-size: .9rem; }
  .detail-actions { display: flex; flex-wrap: wrap; gap: .6rem; margin-top: 1.25rem; }
  .detail-actions .button { width: auto; }

  @media (max-width: 520px) {
    body { padding: .75rem; }
    .recipe-grid { grid-template-columns: 1fr; gap: .75rem; }
    .recipe-media-container { height: 7.5rem; }
    .card-body { padding: 12px 14px; }
    .card-body h2 { font-size: 1.05rem; }
    .detail-body { padding: .9rem 1rem 1.2rem; }
    .detail-body h1 { font-size: 1.4rem; }
  }
</style>
</head>
<body>
<div id="error" class="error" hidden></div>

<section id="list-view" hidden>
  <p id="list-eyebrow" class="eyebrow">Kotlet · Recipes</p>
  <div id="recipe-grid" class="recipe-grid" role="list"></div>
  <p id="list-footer" class="list-footer" hidden></p>
</section>

<section id="detail-view" hidden>
  <button type="button" id="back" class="back">← Recipes</button>
  <article id="detail-card" class="detail-card"></article>
</section>

<p id="loading" class="empty">Loading recipes…</p>

<script>
"use strict";
/* Localization. The app is a static document, so both languages ship inline and the dictionary is
 * chosen at runtime. Precedence: the language the server negotiated for the tool call
 * (_meta["kotlet/locale"], resolved from Accept-Language), then the host's UI locale, then the
 * browser's. Plural forms go through Intl.PluralRules, which Polish needs (1 / 2-4 / 5+). */
const FALLBACK_LANGUAGE = "en";
const STRINGS = {
  en: {
    listEyebrow: "Kotlet · Recipes", back: "← Recipes", loading: "Loading recipes…", loadingShort: "Loading…",
    empty: "No recipes yet.", view: "View recipe", showing: "Showing {shown} of {total}.",
    recipes: { one: "{count} recipe", other: "{count} recipes" },
    servings: { one: "{count} serving", other: "{count} servings" },
    ingredients: { one: "{count} ingredient", other: "{count} ingredients" },
    detailEyebrow: "Recipe", ingredientsHeading: "Ingredients", methodHeading: "Method", aiTitle: "AI-assisted",
    errorRecipe: "The recipe could not be loaded.", errorNoData: "The host returned no recipe data.",
    errorNoList: "The host did not deliver recipe data to the app.", errorHost: "Host request failed.",
    initFailed: "MCP Apps initialization failed: {message}",
    incomplete: "This recipe is incomplete.", noIngredients: "No ingredients added yet.",
    noMethod: "No preparation steps added yet.", edit: "Edit recipe",
    "slot.breakfast": "Breakfast", "slot.second-breakfast": "Second breakfast", "slot.dinner": "Lunch",
    "slot.snack": "Snack", "slot.supper": "Dinner"
  },
  pl: {
    listEyebrow: "Kotlet · Przepisy", back: "← Przepisy", loading: "Ładowanie przepisów…", loadingShort: "Ładowanie…",
    empty: "Nie ma jeszcze przepisów.", view: "Zobacz przepis", showing: "Pokazano {shown} z {total}.",
    recipes: { one: "{count} przepis", few: "{count} przepisy", many: "{count} przepisów", other: "{count} przepisów" },
    servings: { one: "{count} porcja", few: "{count} porcje", many: "{count} porcji", other: "{count} porcji" },
    ingredients: { one: "{count} składnik", few: "{count} składniki", many: "{count} składników", other: "{count} składników" },
    detailEyebrow: "Przepis", ingredientsHeading: "Składniki", methodHeading: "Przygotowanie",
    aiTitle: "Utworzone z pomocą AI",
    errorRecipe: "Nie udało się załadować przepisu.", errorNoData: "Host nie zwrócił danych przepisu.",
    errorNoList: "Host nie przekazał danych przepisów do aplikacji.", errorHost: "Żądanie do hosta nie powiodło się.",
    initFailed: "Inicjalizacja MCP Apps nie powiodła się: {message}",
    incomplete: "Ten przepis jest niekompletny.", noIngredients: "Nie dodano jeszcze składników.",
    noMethod: "Nie dodano jeszcze kroków przygotowania.", edit: "Edytuj przepis",
    "slot.breakfast": "Śniadanie", "slot.second-breakfast": "II śniadanie", "slot.dinner": "Obiad",
    "slot.snack": "Przekąska", "slot.supper": "Kolacja"
  }
};
const locale = { server: null, host: null, browser: navigator.language };
let lang = FALLBACK_LANGUAGE;
const pluralRules = {};
const supportedLanguage = (value) => {
  const code = String(value || "").trim().slice(0, 2).toLowerCase();
  return Object.hasOwn(STRINGS, code) ? code : null;
};
const entry = (key) => {
  const value = STRINGS[lang][key];
  return value === undefined ? STRINGS[FALLBACK_LANGUAGE][key] : value;
};
const fill = (template, values) => values
  ? String(template).replace(/\{(\w+)\}/g, (match, name) => (name in values ? String(values[name]) : match))
  : String(template);
const t = (key, values) => {
  const found = entry(key);
  return found === undefined ? key : fill(found, values);
};
/* Plural-aware lookup: the value is a form table keyed by Intl.PluralRules categories. */
const tp = (key, count, values) => {
  const forms = entry(key);
  if (!forms) return String(count);
  const rules = pluralRules[lang] || (pluralRules[lang] = new Intl.PluralRules(lang));
  return fill(forms[rules.select(count)] || forms.other, Object.assign({ count: count.toLocaleString(lang) }, values));
};
/* Translates a value that arrives from the API (here: meal slots), humanizing unknown members. */
const tv = (prefix, value) => {
  if (!value) return "";
  const found = entry(prefix + "." + String(value).toLowerCase());
  return found === undefined
    ? String(value).replaceAll("-", " ").replace(/^./, (c) => c.toUpperCase())
    : String(found);
};

const PLACEHOLDER_SVG = '<div class="recipe-placeholder" aria-hidden="true"><svg viewBox="0 0 24 24" width="36" height="36" stroke="currentColor" stroke-width="1.6" fill="none" stroke-linecap="round" stroke-linejoin="round"><path d="M6 10v7a3 3 0 0 0 3 3h6a3 3 0 0 0 3-3v-7"/><path d="M4 10h16"/><path d="M10 6h4"/><path d="M12 3v3"/><path d="M8 10V8a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2"/></svg></div>';

function presentationFrom(result) {
  const meta = result && (result._meta || result.meta);
  return meta ? meta["kotlet/recipeUi"] : null;
}

/* Minimal MCP Apps (SEP-1865) bridge.
 * Hand-rolled equivalent of @modelcontextprotocol/ext-apps: JSON-RPC 2.0 over
 * window.parent.postMessage. Kept dependency-free so the UI stays a single HTML
 * document that satisfies the default MCP Apps CSP (no external scripts). */
const bridge = (() => {
  const pending = new Map();
  let nextId = 1;
  const post = (message) => window.parent.postMessage(message, "*");
  const request = (method, params) => new Promise((resolve, reject) => {
    const id = nextId++;
    pending.set(id, { resolve, reject });
    post({ jsonrpc: "2.0", id, method, params });
  });
  const notify = (method, params) => post({ jsonrpc: "2.0", method, params: params ?? {} });
  const notificationHandlers = new Map();

  window.addEventListener("message", (event) => {
    const message = event.data;
    if (!message || message.jsonrpc !== "2.0") return;
    if (message.id !== undefined && message.method === undefined) {
      const entry = pending.get(message.id);
      if (!entry) return;
      pending.delete(message.id);
      if (message.error) entry.reject(new Error(message.error.message || t("errorHost")));
      else entry.resolve(message.result);
    } else if (message.method !== undefined && message.id !== undefined) {
      // Host-initiated request (e.g. ui/resource-teardown): acknowledge with an empty result.
      post({ jsonrpc: "2.0", id: message.id, result: {} });
    } else if (message.method !== undefined) {
      const handler = notificationHandlers.get(message.method);
      if (handler) handler(message.params);
    }
  });

  return {
    request,
    notify,
    on: (method, handler) => notificationHandlers.set(method, handler),
    callTool: (name, args) => request("tools/call", { name, arguments: args })
  };
})();

const el = (id) => document.getElementById(id);
const state = { apiOrigin: "", listData: null, detail: null, view: null };

function attachImageFallback(container, selector) {
  const image = container.querySelector(selector);
  if (!image) return;
  image.addEventListener("error", () => {
    if (image.parentElement) image.parentElement.innerHTML = PLACEHOLDER_SVG;
  }, { once: true });
}

/* Re-picks the dictionary from the known locale sources and, when it changed, re-renders the
 * static chrome and whichever view is on screen. */
function applyLanguage() {
  const next = supportedLanguage(locale.server) || supportedLanguage(locale.host)
    || supportedLanguage(locale.browser) || FALLBACK_LANGUAGE;
  const changed = next !== lang;
  lang = next;
  document.documentElement.lang = lang;
  el("list-eyebrow").textContent = t("listEyebrow");
  el("back").textContent = t("back");
  el("loading").textContent = t("loading");
  if (!changed) return;
  // renderList/renderDetail navigate to what they render, so remember where the user actually is.
  const activeView = state.view;
  if (state.listData) renderList(state.listData);
  if (state.detail) renderDetail(state.detail);
  if (activeView) show(activeView);
}

function applyHostContext(context) {
  const theme = context && context.theme;
  const dark = theme ? theme === "dark" : matchMedia("(prefers-color-scheme: dark)").matches;
  document.documentElement.classList.toggle("app-dark", dark);
  locale.host = (context && (context.locale || context.language)) || locale.host;
  applyLanguage();
}

function showError(message) {
  const box = el("error");
  box.textContent = message;
  box.hidden = false;
}

function show(view) {
  state.view = view;
  el("loading").hidden = true;
  el("list-view").hidden = view !== "list";
  el("detail-view").hidden = view !== "detail";
}

const escapeHtml = (text) => String(text)
  .replaceAll("&", "&amp;").replaceAll("<", "&lt;").replaceAll(">", "&gt;")
  .replaceAll('"', "&quot;").replaceAll("'", "&#39;");

/* Tiny markdown subset (headings, ordered/unordered lists, bold, italics) for
 * descriptionMarkdown. Input is HTML-escaped first, so output stays inert. */
function renderMarkdown(markdown) {
  const inline = (text) => text
    .replace(/\*\*([^*]+)\*\*/g, "<strong>$1</strong>")
    .replace(/\*([^*]+)\*/g, "<em>$1</em>");
  const blocks = [];
  let list = null; // { tag: "ol" | "ul", items: [] }
  const flushList = () => {
    if (list) blocks.push(`<${list.tag}>` + list.items.map((i) => `<li>${i}</li>`).join("") + `</${list.tag}>`);
    list = null;
  };
  for (const rawLine of escapeHtml(markdown).split(/\r?\n/)) {
    const line = rawLine.trim();
    const ordered = line.match(/^\d+[.)]\s+(.*)/);
    const unordered = line.match(/^[-*]\s+(.*)/);
    const heading = line.match(/^(#{1,6})\s+(.*)/);
    if (ordered || unordered) {
      const tag = ordered ? "ol" : "ul";
      if (!list || list.tag !== tag) { flushList(); list = { tag, items: [] }; }
      list.items.push(inline((ordered || unordered)[1]));
    } else if (heading) {
      flushList();
      blocks.push(`<h${Math.min(heading[1].length + 2, 6)}>${inline(heading[2])}</h${Math.min(heading[1].length + 2, 6)}>`);
    } else if (line === "") {
      flushList();
    } else {
      flushList();
      blocks.push(`<p>${inline(line)}</p>`);
    }
  }
  flushList();
  return blocks.join("");
}

const absoluteUrl = (url) =>
  url && url.startsWith("/") ? state.apiOrigin + url : url;

function renderList(data) {
  state.listData = data;
  state.apiOrigin = data.apiOrigin || "";
  const grid = el("recipe-grid");
  grid.innerHTML = "";
  if (data.detail) {
    renderDetail(data.detail);
    return;
  }
  if (!data.recipes || data.recipes.length === 0) {
    grid.innerHTML = `<p class="empty">${escapeHtml(t("empty"))}</p>`;
    show("list");
    return;
  }
  for (const recipe of data.recipes) {
    const card = document.createElement("article");
    card.className = "recipe-card";
    card.setAttribute("role", "listitem");
    const ingredientCount = recipe.ingredientCount || (recipe.ingredients ? recipe.ingredients.length : 0);
    const counts = [];
    if (recipe.servings && recipe.servings > 0) counts.push(tp("servings", recipe.servings));
    if (ingredientCount && ingredientCount > 0) counts.push(tp("ingredients", ingredientCount));
    const summary = recipe.description || recipe.summary || "";
    const summaryText = String(summary).replace(/[*_`#]/g, "").split(/\r?\n/)[0].trim();
    const imageHtml = recipe.imageUrl
      ? `<div class="recipe-media-container"><img class="recipe-image" src="${escapeHtml(recipe.imageUrl)}" alt="${escapeHtml(recipe.title)}" /></div>`
      : `<div class="recipe-media-container">${PLACEHOLDER_SVG}</div>`;
    card.innerHTML =
      imageHtml +
      '<div class="card-body">' +
      `<h2>${escapeHtml(recipe.title)}</h2>` +
      (recipe.mealType ? `<p class="meta">${escapeHtml(tv("slot", recipe.mealType))}</p>` : "") +
      (counts.length ? `<p class="meta">${escapeHtml(counts.join(" · "))}</p>` : "") +
      (summaryText ? `<p class="card-summary">${escapeHtml(summaryText)}</p>` : "") +
      "</div>" +
      `<div class="card-actions"><button type="button" class="button primary">${escapeHtml(t("view"))}</button></div>`;
    attachImageFallback(card, ".recipe-image");
    const viewButton = card.querySelector("button");
    viewButton.addEventListener("click", () => openRecipe(recipe.id, viewButton));
    grid.appendChild(card);
  }
  const footer = el("list-footer");
  footer.hidden = data.totalCount <= data.recipes.length;
  footer.textContent = t("showing", { shown: data.recipes.length, total: tp("recipes", data.totalCount) });
  show("list");
  if (data.totalCount === 1 && data.recipes.length === 1 && data.recipes[0].id) {
    void openRecipe(data.recipes[0].id);
  }
}

function renderDetail(recipe) {
  state.detail = recipe;
  const image = recipe.image || (recipe.images || [])[0];
  const imageUrl = image ? absoluteUrl(image.url || image.contentUrl) : null;
  const ingredients = (recipe.ingredients || []).map((ing) => {
    const wholeQuantity = Number.isInteger(ing.quantity);
    const quantity = wholeQuantity ? ing.quantity : (ing.normalizedQuantity ?? ing.quantity);
    const unit = wholeQuantity ? ing.unit : (ing.normalizedUnit ?? ing.unit);
    const quantityText = [quantity, unit].filter(value => value !== null && value !== undefined && value !== "").join(" ");
    return '<li class="ingredient-item"><span class="ingredient-copy">' +
      `<span class="ing-name">${escapeHtml(ing.name)}</span>` +
      (ing.note ? `<span class="ing-note">${escapeHtml(ing.note)}</span>` : "") +
      `</span>${quantityText ? `<span class="ing-qty">${escapeHtml(String(quantityText))}</span>` : ""}</li>`;
  }).join("");
  const ingredientCount = (recipe.ingredients || []).length;
  const description = recipe.description ?? recipe.descriptionMarkdown ?? "";
  const metaParts = [];
  if (recipe.mealType) metaParts.push(tv("slot", recipe.mealType));
  if (recipe.servings && recipe.servings > 0) metaParts.push(tp("servings", recipe.servings));
  if (ingredientCount > 0) metaParts.push(tp("ingredients", ingredientCount));
  const incomplete = recipe.isIncomplete === true || ingredientCount === 0 || !description.trim();
  const editAction = recipe.canEdit && recipe.editUrl
    ? `<a class="button secondary" href="${escapeHtml(recipe.editUrl)}" target="_blank" rel="noreferrer">${escapeHtml(t("edit"))}</a>`
    : "";
  const descriptionParagraphs = description.trim()
    .replace(/\r\n?/g, "\n")
    .split(/\n\s*\n/)
    .map(paragraph => paragraph.trim())
    .filter(Boolean);
  const detailSummary = descriptionParagraphs.length > 1
    ? descriptionParagraphs[0].replace(/[*_`#]/g, "").split(/\r?\n/)[0].trim()
    : "";
  const ingredientsSection = `<h2>${escapeHtml(t("ingredientsHeading"))}</h2>` +
    (ingredients ? `<ul class="ingredient-list">${ingredients}</ul>` : `<p class="incomplete-note">${escapeHtml(t("noIngredients"))}</p>`);
  const methodSection = `<h2>${escapeHtml(t("methodHeading"))}</h2>` +
    (description.trim() ? `<div class="markdown-body">${renderMarkdown(description)}</div>` : `<p class="incomplete-note">${escapeHtml(t("noMethod"))}</p>`);
  el("detail-card").innerHTML =
    (imageUrl ? `<div class="detail-media-container"><img class="detail-image" src="${escapeHtml(imageUrl)}" alt="${escapeHtml(image.altText || recipe.title)}" /></div>` : `<div class="detail-media-container detail-placeholder">${PLACEHOLDER_SVG}</div>`) +
    '<div class="detail-body">' +
    `<p class="eyebrow">${escapeHtml(t("detailEyebrow"))}${metaParts.length ? " · " + escapeHtml(metaParts.join(" · ")) : ""}</p>` +
    `<h1>${escapeHtml(recipe.title)}</h1>` +
    (detailSummary ? `<p class="detail-meta">${escapeHtml(detailSummary)}</p>` : "") +
    (incomplete ? `<p class="incomplete-note" role="status">${escapeHtml(t("incomplete"))}</p>` : "") +
    ingredientsSection +
    methodSection +
    (editAction ? `<div class="detail-actions">${editAction}</div>` : "") +
    "</div>";
  attachImageFallback(el("detail-card"), ".detail-image");
  show("detail");
}

async function openRecipe(recipeId, button) {
  el("error").hidden = true;
  if (button) { button.disabled = true; button.textContent = t("loadingShort"); }
  try {
    const result = await bridge.callTool("get_recipe", { recipeId });
    if (result.isError) {
      const text = (result.content || []).map((block) => block.text).join(" ");
      throw new Error(text || t("errorRecipe"));
    }
    const presentation = presentationFrom(result);
    if (presentation && presentation.kind === "detail") renderDetail(presentation.detail);
    else if (result.structuredContent) renderDetail(result.structuredContent);
    else throw new Error(t("errorNoData"));
  } catch (error) {
    showError(error.message);
  } finally {
    if (button) { button.disabled = false; button.textContent = t("view"); }
  }
}

el("back").addEventListener("click", () => {
  el("error").hidden = true;
  show("list");
});

bridge.on("ui/notifications/tool-result", (params) => {
  // The server reports the language it served the call in; it wins over the host/browser locale.
  // A result without the key means nothing was negotiated, so an earlier one must not linger.
  locale.server = (params && params._meta && params._meta["kotlet/locale"]) || null;
  applyLanguage();
  const presentation = presentationFrom(params);
  if (presentation && presentation.kind === "list") renderList(presentation);
  else if (presentation && presentation.kind === "detail") renderDetail(presentation.detail);
  else if (params && params.structuredContent) renderList(params.structuredContent);
  else {
    el("loading").hidden = true;
    showError(t("errorNoList"));
  }
});
bridge.on("ui/notifications/host-context-changed", (params) =>
  applyHostContext((params && params.hostContext) || params));

(async () => {
  applyHostContext(null);
  try {
    const result = await bridge.request("ui/initialize", {
      // MCP Apps hosts require appInfo alongside the negotiated protocol version.
      protocolVersion: "2026-01-26",
      appInfo: { name: "kotlet-recipes", version: "1.0.0" },
      appCapabilities: { availableDisplayModes: ["inline"] }
    });
    applyHostContext(result && result.hostContext);
    bridge.notify("ui/notifications/initialized");
  } catch (error) {
    showError(t("initFailed", { message: error.message }));
  }
})();
</script>
</body>
</html>
